sync_boiler_setpoint:
  alias: Sync Boiler Setpoint
  description: Sets manual boiler setpoint to match the calculated target flow temperature
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.last_manual_boiler_setpoint
      data:
        value: "{{ states('sensor.radiator_target_flow_temperature') | float }}"
  mode: single

fireplace_mode:
  alias: Fireplace Mode
  description: Turns off ground floor heating for 6 hours while the fireplace is lit
  icon: mdi:fireplace
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id:
          - climate.kitchen_thermostat
          - climate.vestibule_thermostat
          - climate.bathroom_ground_floor_thermostat
      data:
        hvac_mode: "off"
    - action: timer.start
      target:
        entity_id: timer.fireplace_mode
      data:
        duration: "06:00:00"
  mode: single

leaving_home:
  alias: Leaving Home
  description: Sets all thermostats to 19°C
  icon: mdi:home-export-outline
  sequence:
    - action: climate.set_temperature
      target:
        entity_id:
          - climate.bedroom_thermostat
          - climate.zuzia_thermostat
          - climate.madzia_thermostat
          - climate.piotrek_thermostat
          - climate.office_thermostat
          - climate.kitchen_thermostat
          - climate.vestibule_thermostat
          - climate.bathroom_ground_floor_thermostat
          - climate.bathroom_first_floor_thermostat
      data:
        temperature: 19
  mode: single

back_home:
  alias: Back Home
  description: Applies the current timeslot of every enabled heating schedule
  icon: mdi:home-import-outline
  sequence:
    - repeat:
        for_each: "{{ integration_entities('scheduler') | select('is_state', 'on') | list }}"
        sequence:
          - action: scheduler.run_action
            data:
              entity_id: "{{ repeat.item }}"
  mode: single

feeling_cold:
  alias: Feeling Cold
  description: Raises the target temperature of all thermostats by 1°C
  icon: mdi:snowflake-thermometer
  sequence:
    - repeat:
        for_each:
          - climate.bedroom_thermostat
          - climate.zuzia_thermostat
          - climate.madzia_thermostat
          - climate.piotrek_thermostat
          - climate.office_thermostat
          - climate.kitchen_thermostat
          - climate.vestibule_thermostat
          - climate.bathroom_ground_floor_thermostat
          - climate.bathroom_first_floor_thermostat
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: "{{ repeat.item }}"
            data:
              temperature: >
                {% set current = state_attr(repeat.item, 'temperature') | float(19) %}
                {% set max_temp = state_attr(repeat.item, 'max_temp') | float(23) %}
                {{ [current + 1, max_temp] | min }}
  mode: single

zuzia_home:
  alias: Zuzia Home
  description: Sets Zuzia's thermostat to 21°C
  icon: mdi:human-child
  sequence:
    - action: climate.set_temperature
      target:
        entity_id: climate.zuzia_thermostat
      data:
        temperature: 21
  mode: single
